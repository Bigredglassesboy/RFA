<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RFA Research Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed WebGL room; thin top bar for views, bottom dock for search + SDG filters, floating project card. Deliberately single dark theme (installation in a black room). */
:root{
  color-scheme: dark;
  --bg:#050507;
  --panel:rgba(10,10,14,.84);
  --line:rgba(255,255,255,.12);
  --fg:#f1eff4;
  --mute:rgba(241,239,244,.56);
  --faint:rgba(241,239,244,.32);
  --accent:#ff3cac;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;left:0;right:0;z-index:5;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ui > *{pointer-events:auto}
#top{top:0;padding-block:calc(env(safe-area-inset-top, 0px) + 14px) 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0;pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.brand .count{color:var(--accent);font-size:11px;font-variant-numeric:tabular-nums}
.views{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;backdrop-filter:blur(10px)}
.views button,.toggle,.chip,#clear{font:inherit;color:var(--mute);background:transparent;border:0;cursor:pointer}
.views button{padding:7px 10px;border-radius:5px;font-size:11px;letter-spacing:.04em}
.views button:hover{color:var(--fg)}
.views button[aria-pressed="true"]{background:rgba(255,60,172,.16);color:var(--fg)}
button:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

#dock{bottom:0;padding-block:0 calc(env(safe-area-inset-bottom, 0px) + 14px);display:flex;flex-direction:column;gap:8px;align-items:center}
.dock-inner{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(10px)}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:rgba(0,0,0,.35)}
.search input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--fg);background:transparent;border:0;padding:9px 0;outline:none}
.search input::placeholder{color:var(--faint)}
#matched{color:var(--accent);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
#clear{font-size:14px;padding:4px}
#clear:hover{color:var(--accent)}
.toggle{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.toggle[aria-pressed="true"]{color:var(--fg)}
.toggle[aria-pressed="true"] .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.chips{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:4px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;color:var(--faint);font-size:9px;font-variant-numeric:tabular-nums}
.chip i{display:block;width:100%;aspect-ratio:1.4;max-height:20px;border-radius:3px;background:var(--c);opacity:.35;transition:opacity .2s, box-shadow .2s}
.chip:hover i{opacity:.7}
.chip[aria-pressed="true"] i{opacity:1;box-shadow:0 0 10px var(--c)}
.chip[aria-pressed="true"]{color:var(--fg)}
.hint{font-size:10px;color:var(--faint);text-align:center;letter-spacing:.03em}

#card{position:fixed;z-index:6;left:max(16px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top, 0px) + 74px);width:min(320px, calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--c, var(--accent));border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(10px)}
#card h2{margin:0;font-size:13px;line-height:1.4;font-weight:700;text-wrap:balance}
#card .dept{color:var(--c, var(--accent));font-size:11px}
#card .sdgs{display:flex;flex-direction:column;gap:4px}
#card .sdg{display:flex;gap:8px;align-items:baseline;font-size:10.5px;color:var(--mute)}
#card .sdg b{display:inline-block;min-width:22px;padding:1px 4px;border-radius:3px;color:#fff;font-weight:500;text-align:center;font-size:10px}
#card .kw{font-size:10px;color:var(--faint);line-height:1.5}
#card .close{position:absolute;top:6px;right:8px;font:inherit;font-size:14px;color:var(--faint);background:none;border:0;cursor:pointer}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--faint);font-size:11px;letter-spacing:.2em;text-transform:uppercase;z-index:4;pointer-events:none}
@media (max-width:640px){
  .views button{padding:6px 7px;font-size:10px}
  .brand h1{font-size:13px}
  .chips{grid-template-columns:repeat(17,22px);overflow-x:auto;padding-bottom:2px}
  .hint{display:none}
  #card{top:auto;bottom:calc(env(safe-area-inset-bottom, 0px) + 150px)}
}
@media (prefers-reduced-motion:reduce){ .chip i{transition:none} }
</style>
</head>
<body>


<div id="stage"></div>
<div id="loading">Building the room…</div>

<header class="ui" id="top">
  <div class="brand">
    <span class="eyebrow">Regenerative Fashion Archive</span>
    <h1>Research Room · 8m × 6m</h1>
    <span class="count" id="count">500 projects on four walls</span>
  </div>
  <nav class="views" aria-label="Camera views">
    <button data-view="wide" aria-pressed="true">Wide</button>
    <button data-view="visitor" aria-pressed="false">Visitor</button>
    <button data-view="pc" aria-pressed="false">PC</button>
    <button data-view="doll" aria-pressed="false">Dollhouse</button>
    <button data-view="plan" aria-pressed="false">Plan</button>
  </nav>
</header>

<aside id="card" hidden>
  <button class="close" id="cardClose" aria-label="Close project card">×</button>
  <h2 id="cTitle"></h2>
  <div class="dept" id="cDept"></div>
  <div class="sdgs" id="cSdgs"></div>
  <div class="kw" id="cKw"></div>
</aside>

<footer class="ui" id="dock">
  <div class="dock-inner">
    <div class="searchrow">
      <label class="search" for="q">
        <input id="q" type="search" placeholder="search the archive… try textiles, circular, heritage" autocomplete="off" spellcheck="false">
        <span id="matched"></span>
        <button id="clear" aria-label="Clear search" hidden>×</button>
      </label>
      <button class="toggle" id="visitorToggle" aria-pressed="true"><span class="dot"></span>Visitor</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by Sustainable Development Goal"></div>
  </div>
  <div class="hint">drag to orbit · scroll or pinch to zoom · tap a dot for its project · tap the floor to move the visitor</div>
</footer>

,"Fashion Business",["life cycle","luxury","leather","handbag","footprint","assessment"],[12,13,9]],["Secondhand clothing markets and poverty alleviation in East Africa","Fashion Business",["secondhand","Africa","poverty","trade","consumption","livelihoods"],[1,10,12]],["Fashion waste valorisation through community textile sorting hubs","Fashion Business",["waste","sorting","circular","community","valorisation","textiles"],[12,11,8]],["Repair culture and the right-to-repair movement in fashion","Fashion Business",["repair","circular","culture","policy","consumption","longevity"],[12,9,8]],["Garment worker wages and living standards in Bangladesh export zones","Fashion & Society",["garment workers","wages","Bangladesh","labour","supply chain","poverty"],[8,1,10]],["Gender-based violence in fashion supply chains in Southeast Asia","Fashion & Society",["gender","violence","supply chain","labour","women","Southeast Asia"],[5,8,16]],["Transparency mapping: from cotton field to shop floor","Fashion & Society",["transparency","supply chain","mapping","cotton","traceability","trade"],[12,8,17]],["Child labour in artisanal gem supply chains linked to fashion jewellery","Fashion & Society",["child labour","gems","jewellery","supply chain","rights","trade"],[8,16,1]],["Living wage certification and its uptake among UK fashion retailers","Fashion & Society",["living wage","certification","retail","labour","UK","workers"],[8,10,1]],["Migrant labour in Italian luxury leather goods manufacturing","Fashion & Society",["migrant","labour","luxury","leather","Italy","manufacturing"],[8,10,16]],["Digital traceability tools and worker voice in garment factories","Fashion & Society",["traceability","digital","workers","factories","voice","rights"],[8,9,16]],["AI-generated fashion design and the future of creative authorship","Fashion Technology",["AI","design","generative","creative","authorship","innovation"],[9,4,8]],["3D body scanning for inclusive sizing and reduced sample waste","Fa const PM={l:0.3,r:0.3,t:0.25,b:0.4};

scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[-4,-3],[4,-3],[4,3],[-4,3]].map(([x,z])=>new THREE.Vector3(x,0.005,z))),new THREE.LineBasicMaterial({color:0x3a3a44})));

let query='', active=new Set(), searching=false, matchCount=0;
function syncSearch(){
  const toks=query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  searching=toks.length>0||active.size>0; matchCount=0;
  for (const d of DOTS){
    const hit=(!toks.length||toks.every(t=>d.p.hay.includes(t))) && (!active.size||d.p.sdgs.some(s=>active.has(s)));
    d.hit=searching&&hit; if (d.hit) matchCount++;
    if (!searching){ d.ta=d.a; d.ts=d.base; } else if (hit){ d.ta=1; d.ts=d.base*2.1; } else { d.ta=0.04; d.ts=d.base*0.55; } }
  document.getElementById('matched').textContent=searching?(matchCount?matchCount+' matched':'no match'):'';
  document.getElementById('clear').hidden=!searching;
  document.getElementById('count').textContent=searching?`${matchCount} projects surfaced`:'500 projects on four walls';
  for (const w of WALLS) w.light.intensity=searching?0.7:1.5;
  drawBars(); drawPC();
}
function drawBars(){
  const g=barCanvas.getContext('2d'), W=1024, H=620;
  g.fillStyle='#050507'; g.fillRect(0,0,W,H); g.strokeStyle='rgba(255,255,255,.22)'; g.lineWidth=3; g.strokeRect(1.5,1.5,W-3,H-3);
  const counts=SDGS.map((_,i)=>DOTS.filter(d=>d.p.sdg===i&&(!searching||d.hit)).length), max=Math.max(...counts,1);
  g.fillStyle='rgba(255,255,255,.6)'; g.font=`500 26px ${MONO}`;
  g.fillText(searching?(query?`“${query.trim()}” · `:'')+`${matchCount} projects`:'SDG distribution · 500 projects',36,52);
  const gx=36, gw=W-72, base=H-70, top=96, step=gw/17;
  counts.forEach((n,i)=>{ const hh=(n/max)*(base-top), on=!searching||n>0;
    g.globalAlpha=on?0.95:0.15; g.fillStyle=SDGS[i][1]; g.fillRect(gx+i*step+step*.16,base-Math.max(hh,3),step*.68,Math.max(hh,3));
    g.globalAlpha=on?0.55:0.2; g.fillStyle='#fff'; g.font=`500 17px ${MONO}`; g.textAlign='center';
    g.fillText(String(i+1).padStart(2,'0'),gx+i*step+step/2,base+32); if(on&&n) g.fillText(n,gx+i*step+step/2,base-hh-10); });
  g.textAlign='left'; g.globalAlpha=1; barTex.needsUpdate=true;
}

// ── per-frame ───────────────────────────────────────────────────
const BONES=[['head','shL'],['head','shR'],['shL','shR'],['shL','hipL'],['shR','hipR'],['hipL','hipR'],['shL','hipR'],['shR','hipL'],
  ['shL','elL'],['elL','haL'],['shR','elR'],['elR','haR'],['hipL','ftL'],['hipR','ftR']];
const tmpV=new THREE.Vector3(), rayP=new THREE.Ray();
function updateVisitor(dt){
  const dx=visitor.tx-visitor.x, dz=visitor.tz-visitor.z, dist=Math.hypot(dx,dz);
  const walking=dist>0.02; const step=Math.min(dist,1.1*dt);
  if (walking){ visitor.x+=dx/dist*step; visitor.z+=dz/dist*step; }
  const w=wallFor(visitor.x,visitor.z); visitor.wall=w;
  const targetRot=walking?Math.atan2(dx,dz):Math.atan2(-w.n.x,-w.n.z);
  let dr=targetRot-visitor.rot; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); visitor.rot+=dr*Math.min(1,dt*6);
  visitor.arm.rotation.x+=((walking?-0.3:-2.3)-visitor.arm.rotation.x)*Math.min(1,dt*5);
  const g=visitor.g; g.visible=visitor.on; g.position.set(visitor.x,walking?Math.abs(Math.sin(performance.now()*0.012))*0.03:0,visitor.z); g.rotation.y=visitor.rot; g.updateMatrixWorld(true);
  // shadow + projected joints
  const M=shadowMatrix(w.plane,w.lens);
  shadows.forEach((s,i)=>{ s.visible=visitor.on && w.vis>0.5; s.matrix.multiplyMatrices(M,visitor.parts[i].matrixWorld); s.matrixWorldNeedsUpdate=true; });
  shadowMat.clippingPlanes=w.clip;
  if (!visitor.on){ visitor.proj=null; return; }
  const P={};
  for (const [k,o] of Object.entries(visitor.J)){ o.getWorldPosition(tmpV); rayP.origin.copy(w.lens); rayP.direction.copy(tmpV).sub(w.lens).normalize();
    const hit=rayP.intersectPlane(w.plane,new THREE.Vector3()); if (!hit) continue; P[k]={...toUV(w,hit), mag:hit.distanceTo(w.lens)/tmpV.distanceTo(w.lens)}; }
  visitor.proj=P; visitor.hand= walking?null:P.haL;
}
function segDist(px,py,a,b){ const dx=b.u-a.u, dy=b.v-a.v, L=dx*dx+dy*dy||1; let t=((px-a.u)*dx+(py-a.v)*dy)/L; t=Math.max(0,Math.min(1,t));
  const cx=a.u+t*dx, cy=a.v+t*dy; return [Math.hypot(px-cx,py-cy),cx,cy]; }
function updateDots(t,dt){
  const vp=visitor.proj, vw=visitor.wall, k=Math.min(1,dt*3.2), kf=Math.min(1,dt*5);
  for (let i=0;i<N;i++){ const d=DOTS[i];
    let tu=d.hu+Math.sin(t*d.fs+d.ph)*0.035, tv=d.hv+Math.cos(t*d.fs*0.7+d.ph)*0.025; let att=0;
    if (vp && d.w===vw && vp.head){ const R=0.42*vp.head.mag; let best=[1e9,0,0];
      for (const [a,b] of BONES){ if (!vp[a]||!vp[b]) continue; const s=segDist(tu,tv,vp[a],vp[b]); if (s[0]<best[0]) best=s; }
      if (best[0]<R){ const f=(R-best[0])/(best[0]||1e-3); tu+=(tu-best[1])*f; tv+=(tv-best[2])*f; }
      if (visitor.hand){ const h=visitor.hand, dx=h.u-tu, dy=h.v-tv, dd=Math.hypot(dx,dy), RR=1.6;
        if (dd<RR && best[0]>R*0.9){ const f=Math.pow(1-dd/RR,1.2)*0.6; tu+=dx*f; tv+=dy*f; att=1; } } }
    d.u+=(tu-d.u)*k; d.v+=(tv-d.v)*k; d.att+=(att-d.att)*kf;
    d.alpha+=(d.ta*(1+d.att*0.25)*d.w.vis-d.alpha)*kf; d.size+=(d.ts*(1+d.att*0.3)-d.size)*kf;
    const pulse=d.hit?(Math.sin(t*2.6+d.ph)*0.18+0.92):1;
    const wp=wallPt(d.w,d.u,d.v,0.016); pos[i*3]=wp.x; pos[i*3+1]=wp.y; pos[i*3+2]=wp.z;
    siz[i]=d.size*pulse; alp[i]=Math.min(1,d.alpha); }
  pgeo.attributes.position.needsUpdate=true; pgeo.attributes.size.needsUpdate=true; pgeo.attributes.alpha.needsUpdate=true;
}
function cutaway(){ // dollhouse: hide the walls between the camera and the room
  const c=camera.position;
  for (const w of WALLS){ const outside=c.clone().sub(w.c).dot(w.n)<-0.05; const v=outside?0:1; w.vis=v;
    w.mesh.visible=w.field.visible=w.beam.visible=!!v; w.light.visible=!!v; }
  ceil.visible=c.y<RH-0.05; barMesh.visible=WALLS[1].vis>0.5;
}

// ── post + loop ─────────────────────────────────────────────────
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),0.75,0.5,0.32); composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize(){ const w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h,false); composer.setSize(w,h); bloom.setSize(w,h);
  camera.aspect=w/h; camera.fov=w<h?78:62; camera.updateProjectionMatrix(); pmat.uniforms.uScale.value=(h*DPR)/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))); }
window.addEventListener('resize',resize);

camera.position.set(...VIEWS.wide.p); controls.target.set(...VIEWS.wide.t); controls.update();
resize(); syncSearch();
DOTS.forEach(d=>{ d.alpha=d.ta; });
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock(); let t=0;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05); t+=reduce?0:dt;
  if (fly){ fly.k=Math.min(1,fly.k+dt*(reduce?10:1.1)); const e=fly.k<.5?4*fly.k**3:1-Math.pow(-2*fly.k+2,3)/2;
    camera.position.lerpVectors(fly.fp,fly.tp,e); controls.target.lerpVectors(fly.ft,fly.tt,e); if (fly.k>=1) fly=null; }
  controls.update(); cutaway(); updateVisitor(dt); updateDots(t,dt);
  if (selected){ ring.visible=selected.w.vis>0.5; ring.position.copy(wallPt(selected.w,selected.u,selected.v,0.02)); ring.rotation.y=selected.w.rotY;
    ring.scale.setScalar(Math.max(selected.size*14,1)); } else ring.visible=false;
  composer.render(); requestAnimationFrame(loop);
}
document.getElementById('loading').remove();
loop();
</script>
